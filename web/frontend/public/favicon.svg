<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <title>TraceHub</title>
  <defs>
    <linearGradient id="tile" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="32" y1="28" x2="96" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7dd3fc"/>
      <stop offset="0.45" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#tile)"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="2"/>
  <!-- API 网关意象：两路上游汇入 · 中枢 · 一路下发 -->
  <g stroke="url(#accent)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path stroke-width="14" d="M38 46 L62 70 L90 46"/>
    <path stroke-width="14" d="M62 70 V102"/>
  </g>
  <circle cx="38" cy="46" r="12" fill="url(#accent)"/>
  <circle cx="90" cy="46" r="12" fill="url(#accent)"/>
  <circle cx="62" cy="70" r="14" fill="url(#accent)"/>
  <circle cx="62" cy="102" r="12" fill="url(#accent)"/>
</svg>
