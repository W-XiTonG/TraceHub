services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracehub
      POSTGRES_PASSWORD: tracehub
      POSTGRES_DB: tracehub
    ports:
      - "5432:5432"
    volumes:
      - tracehub_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  tracehub:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    volumes:
      - ../configs/config.docker.yaml:/app/config.yaml:ro

volumes:
  tracehub_pg:
