server:
  # 生产运营常用 :80（浏览器访问 http://你的域名/ ，无需写端口）；本地开发可改为 :8080
  addr: ":80"
  mode: release # 本地联调可用 debug
  # 内置 TLS（可选）：enabled 也可在管理后台「系统配置 → 访问安全」写入 server.tls.enabled（须重启生效）
  # tls:
  #   enabled: false
  #   addr: ":443"
  #   cert_file: /etc/tracehub/ssl/fullchain.pem
  #   key_file: /etc/tracehub/ssl/privkey.pem

database:
  dsn: "postgres://tracehub:tracehub@localhost:5432/tracehub?sslmode=disable"

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

security:
  # 生产环境必须替换为高强度随机串（建议 ≥32 字符）；勿使用示例占位符
  jwt_secret: "<REPLACE_WITH_LONG_RANDOM_SECRET>"
  # AES-256 key: exactly 32 bytes as base64 or raw; if absent, derived from jwt_secret via SHA256
  aes_key_base64: ""
  # 非空时 GET /metrics 需携带 Authorization: Bearer <metrics_bearer_token>；生产建议配置或由反向代理限制访问
  # metrics_bearer_token: ""

site:
  # 对外展示的应用版本（首页页脚、/health、管理后台运维）；改此处后重启服务即可
  app_version: "1.0.0"
  # 全局不计费模型（逻辑 model ID）；分组 model_rates.billable=false 可覆盖为计费
  # no_bill_models:
  #   - "gpt-4o-mini"
  api_key_prefix: "sk-th-"
  currency_quota_per_yuan: 10000
  # 可选：每 1 美元上游成本对应多少「额度」；>0 时管理端「美元→额度」优先用此项（否则用 pricing_cny_per_usd × currency_quota_per_yuan）
  # currency_quota_per_usd: 0
  # 可选：美元兑人民币参考价（1 USD = 多少 CNY）；未配 currency_quota_per_usd 时美元标价换算需要此项且须 >0
  # pricing_cny_per_usd: 7.2
  # 全站默认成本加成 %（0=不加价）；扣费时应用，单模型可在全局计价表覆盖
  # default_pricing_markup_percent: 0
  default_new_user_balance: 5000 # 试用额度（额度单位）
  # 注册页与官网首页推广说明（可被管理后台覆盖）；留空则不展示
  # register_promo_text: "新用户注册即送 5000 额度（约合 ¥0.5），注册成功后自动到账。"
  # 浏览器跨域：生产请写完整 Origin（80 端口不写 :80），例 http://182.92.159.29 或 https://api.example.com
  # 本地 npm run dev 时可加 http://127.0.0.1:5173；与 * 组合时 * 表示未匹配请求不携带 Credentials
  cors_origins:
    - "http://182.92.159.29"
    - "*"
  # Realtime 通话子资源（POST .../realtime/calls/{id}/accept 等）：可选 Redis 映射，见 docs/P3-Realtime通话子资源产品设计.md
  # realtime_call_mapping_enabled: false
  # realtime_call_mapping_ttl_sec: 86400
  # realtime_call_control_bill_reject_hangup: false
  #
  # 能力探测（运行时 overlay + 异步落库；fail_stale_hours / probe.enabled 可在管理后台 system_configs 覆盖）
  # upstream_capability.runtime_enabled: true
  # upstream_capability.fail_stale_hours: 6   # 近期 fail 超时后 UI 显示「待验证」；0=永不过期
  # upstream_capability_probe.enabled: false  # 后台视频冒烟，默认关
  #
  # 三～五：OpenAI 兼容扩展（可选）
  # openai_compat_channel_types: [] # 例: ["siliconflow"] — 与 openai 一样走 /v1 JSON 透传的额外渠道类型名
  #
  # 视频（/v1/videos*）：openai_compat 渠道直转；另可建 channel_type=volcengine，api_base_url 例:
  #   https://ark.cn-beijing.volces.com/api/v3
  # models 填 doubao-seedance-* / seedance 等；model_alias 映射用户请求名 → 方舟 endpoint 模型名
  # block_openai_account_admin_paths: true # 四：默认拦截 /v1 下 organizations、organization、dashboard、billing 等账号/控制台类路径
  # openai_account_admin_deny_prefixes: [] # 相对 /v1/ 的额外拒绝前缀
  # openai_passthrough:
  #   enabled: false
  #   allow_prefixes: [] # 必填白名单，如 ["experimental/foo"]；未命中则 404
  #   deny_prefixes: []
  #   patch_model_in_json: true
  #
  # 可灵原生 API 透传：/v1/kling/{官方路径} → api-beijing.klingai.com/v1/{官方路径}
  # kling_native:
  #   enabled: true
  #   extra_allow_prefixes: []
  #   deny_prefixes: []
  #   patch_model_in_json: true
  #
  # 可选：非空时写入 /health、/ready JSON 的 operator 字段，便于监控或对外展示运营方
  operator_display_name: "循迹未来"
  # 登录页图形验证码（防脚本撞库、刷发登录邮件）。开启后依赖 Redis；本地无 Redis 时请改为 enabled: false
  login_captcha:
    enabled: true
    ttl_seconds: 300
  # HTTPS 策略：强制跳转 / HSTS 可在管理后台覆盖（保存后约 10s 生效）；内置 TLS 见 server.tls
  # https:
  #   force_redirect: false
  #   hsts_enabled: true
  #   hsts_max_age_seconds: 31536000
  # 可选：管理后台「本地上传品牌图标」保存目录（进程可写）；默认 data/site_brand，对外 URL 为 /uploads/site-brand/site-brand-*.{png,jpg,...}（多版本保留）
  # brand_upload_dir: ./data/site_brand

email:
  enabled: false
  smtp_host: ""
  smtp_port: 587
  smtp_user: ""
  smtp_password: ""
  from: "" # 例: "循迹未来 TraceHub <noreply@example.com>"
  starttls: true
  insecure_skip_verify: false
  # 仅当「非三语邮件」且界面/请求为简中（zh-CN）时用作邮件主题；留空则用内置「{operator} · TraceHub 登录验证码」
  login_code_subject: "循迹未来 · TraceHub 登录验证码"
  # 同上，注册验证码；留空则用内置简中主题
  register_code_subject: "循迹未来 · TraceHub 注册验证码"
  login_code_ttl_minutes: 10
  login_code_resend_seconds: 60
  login_code_max_per_hour: 8
  # true：验证码邮件正文固定包含简中、繁中、English 三段（忽略请求的 locale）；false：按请求 locale（zh-CN/zh-TW/en）或 Accept-Language 发送单一语言
  code_email_trilingual: false

bootstrap:
  admin_email: "admin@example.com"
  # 首次种子管理员密码：部署时务必改为强密码；勿保留仓库示例值
  admin_password: "<REPLACE_WITH_STRONG_PASSWORD>"
  default_group_name: "基础分组"

# 上线前自检：① security.jwt_secret / bootstrap.admin_password 已替换 ② 生产 database.sslmode 与 Redis 密码
# ③ 按需设置 security.metrics_bearer_token 或限制 /metrics 仅内网 ④ site.cors_origins 为真实前端 Origin，勿用弱口令
# ⑤ server.addr 为 :80 时 Linux 需 root 或 setcap；亦可 Nginx 占 80 反代到 :8080（见 docs/development-docs/deployment-ops.md）
# ⑥ 管理后台「站点 / 公开」中设置 API 对外 Base URL，例 http://182.92.159.29/v1（勿带 :80）
