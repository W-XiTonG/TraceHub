server:
  addr: ":8080"
  mode: debug # release

database:
  dsn: "postgres://tracehub:tracehub@localhost:5432/tracehub?sslmode=disable"

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

security:
  jwt_secret: "change-me-to-long-random-string"
  # AES-256 key: exactly 32 bytes as base64 or raw; if absent, derived from jwt_secret via SHA256
  aes_key_base64: ""

site:
  api_key_prefix: "sk-th-"
  currency_quota_per_yuan: 10000
  default_new_user_balance: 100000 # 试用额度（额度单位）
  cors_origins:
    - "*"

bootstrap:
  admin_email: "admin@example.com"
  admin_password: "Admin123!"
  default_group_name: "基础分组"
