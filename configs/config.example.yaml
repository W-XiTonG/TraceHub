server:
  addr: ":8080"
  mode: debug # release

database:
  dsn: "postgres://tracehub:tracehub@localhost:5432/tracehub?sslmode=disable"

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

security:
  jwt_secret: "change-me-to-long-random-string"
  # AES-256 key: exactly 32 bytes as base64 or raw; if absent, derived from jwt_secret via SHA256
  aes_key_base64: ""

site:
  api_key_prefix: "sk-th-"
  currency_quota_per_yuan: 10000
  default_new_user_balance: 100000 # 试用额度（额度单位）
  cors_origins:
    - "*"
  # Realtime 通话子资源（POST .../realtime/calls/{id}/accept 等）：可选 Redis 映射，见 docs/P3-Realtime通话子资源产品设计.md
  # realtime_call_mapping_enabled: false
  # realtime_call_mapping_ttl_sec: 86400
  # realtime_call_control_bill_reject_hangup: false
  #
  # 三～五：OpenAI 兼容扩展（可选）
  # openai_compat_channel_types: [] # 例: ["siliconflow"] — 与 openai 一样走 /v1 JSON 透传的额外渠道类型名
  # block_openai_account_admin_paths: true # 四：默认拦截 /v1 下 organizations、organization、dashboard、billing 等账号/控制台类路径
  # openai_account_admin_deny_prefixes: [] # 相对 /v1/ 的额外拒绝前缀
  # openai_passthrough:
  #   enabled: false
  #   allow_prefixes: [] # 必填白名单，如 ["experimental/foo"]；未命中则 404
  #   deny_prefixes: []
  #   patch_model_in_json: true
  #
  # 可选：非空时写入 /health、/ready JSON 的 operator 字段，便于监控或对外展示运营方
  operator_display_name: "循迹未来"
  # 登录页图形验证码（防脚本撞库、刷发登录邮件）。开启后依赖 Redis；本地无 Redis 时请改为 enabled: false
  login_captcha:
    enabled: true
    ttl_seconds: 300
  # 可选：管理后台「本地上传品牌图标」保存目录（进程可写）；默认 data/site_brand，对外 URL 为 /uploads/site-brand/site-brand-*.{png,jpg,...}（多版本保留）
  # brand_upload_dir: ./data/site_brand

email:
  enabled: false
  smtp_host: ""
  smtp_port: 587
  smtp_user: ""
  smtp_password: ""
  from: "" # 例: "循迹未来 TraceHub <noreply@example.com>"
  starttls: true
  insecure_skip_verify: false
  # 仅当「非三语邮件」且界面/请求为简中（zh-CN）时用作邮件主题；留空则用内置「{operator} · TraceHub 登录验证码」
  login_code_subject: "循迹未来 · TraceHub 登录验证码"
  # 同上，注册验证码；留空则用内置简中主题
  register_code_subject: "循迹未来 · TraceHub 注册验证码"
  login_code_ttl_minutes: 10
  login_code_resend_seconds: 60
  login_code_max_per_hour: 8
  # true：验证码邮件正文固定包含简中、繁中、English 三段（忽略请求的 locale）；false：按请求 locale（zh-CN/zh-TW/en）或 Accept-Language 发送单一语言
  code_email_trilingual: false

bootstrap:
  admin_email: "admin@example.com"
  admin_password: "Admin123!"
  default_group_name: "基础分组"
