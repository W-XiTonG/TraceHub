server:
  addr: ":8080"
  mode: release

database:
  dsn: "postgres://tracehub:tracehub@postgres:5432/tracehub?sslmode=disable"

redis:
  addr: "redis:6379"
  password: ""
  db: 0

security:
  jwt_secret: "docker-change-me-use-long-random-secret-string-here"

site:
  app_version: "1.0.0"
  api_key_prefix: "sk-th-"
  currency_quota_per_yuan: 10000
  default_new_user_balance: 100000
  register_promo_text: "新用户注册即送额度，注册成功后自动到账。"
  cors_origins:
    - "*"
  operator_display_name: "循迹未来"
  login_captcha:
    enabled: true
    ttl_seconds: 300

email:
  enabled: false
  smtp_host: ""
  smtp_port: 587
  smtp_user: ""
  smtp_password: ""
  from: ""
  starttls: true
  insecure_skip_verify: false
  login_code_subject: "循迹未来 · TraceHub 登录验证码"
  register_code_subject: "循迹未来 · TraceHub 注册验证码"
  login_code_ttl_minutes: 10
  login_code_resend_seconds: 60
  login_code_max_per_hour: 8
  code_email_trilingual: false

bootstrap:
  admin_email: "admin@example.com"
  admin_password: "Admin123!"
  default_group_name: "基础分组"
